<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CSS oklch Gradation</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap");
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
*::before,
*::after {
  box-sizing: border-box;
}
html,
body {
  overscroll-behavior-x: none;
  overscroll-behavior-y: none;
  scroll-behavior: smooth;
  -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
}
@property --hue1 {
  syntax: "<angle>";
  inherits: false;
  initial-value: 0deg;
}
@property --hue2 {
  syntax: "<angle>";
  inherits: false;
  initial-value: 0deg;
}
body {
  font-family: "Geist", sans-serif;
  position: relative;
  width: 100%;
  max-width: 100vw;
  min-height: 100vh;
  text-align: center;
  overflow-x: hidden;
  background-image: linear-gradient(
      in oklch longer hue to right,
      oklch(0.93 0.08 var(--hue1) / 50%),
      oklch(0.93 0.08 var(--hue2) / 50%)
    ),
    linear-gradient(
      in oklch longer hue to bottom,
      oklch(0.93 0.08 var(--hue1) / 50%),
      oklch(0.93 0.08 var(--hue2) / 50%)
    );

  background-size: 100% 100%;
  color: PaleVioletRed;

  -webkit-animation-name: anim_bg;

          animation-name: anim_bg;
  -webkit-animation-duration: 5s;
          animation-duration: 5s;
  -webkit-animation-timing-function: linear;
          animation-timing-function: linear;
  -webkit-animation-iteration-count: infinite;
          animation-iteration-count: infinite;
}
@-webkit-keyframes anim_bg {
  0% {
    --hue1: 0deg;
    --hue2: 300deg;
  }

  100% {
    --hue1: 360deg;
    --hue2: 660deg;
  }
}
@keyframes anim_bg {
  0% {
    --hue1: 0deg;
    --hue2: 300deg;
  }

  100% {
    --hue1: 360deg;
    --hue2: 660deg;
  }
}
main {
  position: relative;
}
section {
  position: relative;
  width: 100%;
  height: auto;
  min-height: 100vh;
  display: grid;
  place-items: center;
}
h1 {
  text-transform: uppercase;
}
</style>
</head>
<body>

  <section>
    <div>
      <h1>CSS oklch Gradation</h1>
      <p>animation</p>
    </div>
  </section>
</main>


</body>
</html>
