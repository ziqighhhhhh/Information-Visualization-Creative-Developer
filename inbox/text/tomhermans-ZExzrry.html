<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>mask image blend CSS custom properties w/ tweakpane controls</title>
<style>
:root {
  --pct1: 33;
  --pct2: 66;
  --angle: 90;
}

body {
  display: grid;
  min-height: 100vh;
  place-content: center;
  padding: 2rem;
}

.s {
  position: relative;
  min-width: 70vw;
  min-height: 50vh;
  aspect-ratio: 3/2;
  box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.4);
}
.s > * {
  position: absolute;
  inset: 0;
  background-size: cover;
}
.s .p1 {
  background-image: url(https://images.unsplash.com/photo-1654445875514-90eb0d03a9f1?crop=entropy&cs=tinysrgb&fit=crop&fm=jpg&h=600&ixid=MnwxfDB8MXxyYW5kb218MHx8fHx8fHx8MTY1NjMxODM2Mw&ixlib=rb-1.2.1&q=80&w=800);
}
.s .p2 {
  background-image: url(https://images.unsplash.com/photo-1654169761792-14abd60cc8ea?crop=entropy&cs=tinysrgb&fit=crop&fm=jpg&h=600&ixid=MnwxfDB8MXxyYW5kb218MHx8fHx8fHx8MTY1NjMxODQ4Mg&ixlib=rb-1.2.1&q=80&w=800);
  -webkit-mask-image: linear-gradient(calc(var(--angle) * 1deg), transparent calc(var(--pct1) * 1%), #fff calc(var(--pct2) * 1%));
}

*,
*::before,
*::after {
  box-sizing: border-box;
}
</style>
</head>
<body>
<h2>faded image blend</h2>
<div class="s">
  <div class="p1"></div>
  <div class="p2"></div>
</div>

<script>
console.clear();

// tweakpane parameters
const minmax = { min: 0, max: 100, step: 1 };
const minmax360 = { min: 0, max: 360, step: 1 };

const PARAMS = {
  pct1: 30,
  pct2: 66,
  angle: 90,
  // msg: "Tweakpane ready",
  // svgfilter: "",
  // blendmode: "",
  diffscale: ["angle"] // add properties that require a different scale
};
const wrap = document.getElementById("wrap");

const pane = new Tweakpane.Pane();
// loop through all PARAMS and add onChange handler
for (const [property, value] of Object.entries(PARAMS)) {
  console.log("xxx", `${property}::: ${PARAMS[property]}`);
  if (isInArray(property, PARAMS.diffscale)) {
    console.log("diffscale");
    pane.addInput(PARAMS, `${property}`, minmax360).on("change", val => {
      setCustomProp(`${property}`, val.value);
    });
  } else {
    // run the property through the onChange and hook up with custom function
    pane.addInput(PARAMS, `${property}`, minmax).on("change", val => {
      setCustomProp(`${property}`, val.value);
    });
  }
}

function setCustomProp(prop, val, unit = "") {
  // on root elem
  console.log(prop + " - " + val + " : " + unit);
  document.documentElement.style.setProperty("--" + prop, val + unit);
}

//FUNCTIONS
function isInArray(value, array) {
  return array.indexOf(value) > -1;
}

function toKebabCase(str) {
  return str.replace(/([a-z0-9])([A-Z])/g, "$1-$2").toLowerCase();
}
</script>
</body>
</html>
