<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Centered text</title>
<style>
body{
  margin:0;
  background-color:grey;
  height: 300vh;
}
h2{
  margin:20px;
  font-family: sans-serif;
  color:green;
}
.wrap{
  margin-top: 50vh;
  display: flex;
  justify-content: center;
}

.wrap-container {
  max-width: 950px;
  margin
}

div{
  position: relative;
  font-family: sans-serif;
  font-size: 36px;
  font-weight: 600;
  text-align: center;
}

div {
  display: inline-block;
}

span{
  position: absolute;
  width: 0;
  height: 100%;
  color: #0fd10f;
  left: 0;
  overflow:hidden;
  text-align: center;
}
</style>
</head>
<body>
<h2>Scroll ...</h2>

<div class="wrap">
  <div class="wrap-container">

    <div>Silky<span>Silky</span></div>
    <div>smooth<span>smooth</span></div>
    <div>animation<span>animation</span></div>
    <div>is<span>is</span></div>
    <div>the<span>the</span></div>
    <div>hallmark<span>hallmark</span></div>
    <div>of<span>of</span></div>
    <div>any<span>any</span></div>
    <div>library.<span>library.</span></div>
    <br>
    <div>Silky<span>Silky</span></div>
    <div>smooth<span>smooth</span></div>
    <div>animation?<span>animation?</span></div>
    <br>
    <div>GSAP<span>GSAP</span></div>
    <div>has<span>has</span></div>
    <div>you<span>you</span></div>
    <div>covered.<span>covered.</span></div>

  </div>
</div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script>
gsap.set('span', { width: 0 })

gsap.timeline({
    scrollTrigger:{
      trigger: 'span',
      scrub:0.3,
      start:"top 40%",
      end:"top 20%",
      //markers:true
    }
 })
  .to('span', {
  width:'100%', 
  duration:1, ease:'none',
  stagger:1
})
</script>
</body>
</html>
