:root {
  --grainy: url("data:image/svg+xml,%3Csvg viewBox='0 0 250 250' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.829' numOctaves='6' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
}

:root {
  --opacityExp: "";
}

body {
  display: grid;
  place-items: center;
  min-height: 100vh;
  font-family: "DM Sans";
  background: #eee;
  background: radial-gradient(closest-side, #fff, rgba(0, 0, 0, 0.4));
}
body::before {
  background: var(--grainy);
  mix-blend-mode: luminosity;
  content: "";
  display: block;
  inset: 0;
  opacity: 0.7;
  position: absolute;
  z-index: 0;
}

input[type=range] {
  --w: 200px;
  --w2: 12px;
  --angle: 160deg;
  --posx: calc(cos(var(--angle) + 135deg ) * (var(--w) / 2.4));
  --posy: calc(sin(var(--angle) + 135deg) * (var(--w) / 2.4));
  width: var(--w);
  height: var(--w);
  position: relative;
  cursor: grab;
}
input[type=range]::before {
  content: "";
  position: absolute;
  top: calc(50% - var(--w) / 2 - var(--w2) / 4);
  left: calc(50% - var(--w) / 2 - var(--w2) / 4);
  width: var(--w);
  height: var(--w);
  border-radius: 50%;
  background: rgba(173, 133, 133, 0.7);
  background: repeating-conic-gradient(#888 0%, #ddd 15%, #999 33%, #eee 40%, #aaa 50%);
  opacity: var(--opacityExp);
  border: 5px solid #aaa;
  box-shadow: 0 0 4px 15px #000;
  transform: rotate(var(--angle));
}
input[type=range]::after {
  content: "";
  display: block;
  position: absolute;
  top: calc(50% - var(--w2) / 2);
  left: calc(50% - var(--w2) / 2);
  translate: var(--posx) var(--posy);
  width: var(--w2);
  height: var(--w2);
  border-radius: 50%;
  border: 2px solid #444;
  background: radial-gradient(closest-side, #333, rgba(0, 0, 0, 0.5));
}

div {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 5vw;
  text-align: center;
}

.knobVal {
  font-size: 10vw;
  color: #333;
  text-shadow: 3px 3px 2px #aaa;
  font-variant-numeric: tabular-nums;
  transition: color 0.4s ease-in-out;
  margin-top: 2rem;
  z-index: 2;
}
.knobVal.active {
  color: firebrick;
}

p {
  text-transform: uppercase;
  font-size: clamp(1.4rem, 3vw, 5vw);
  letter-spacing: 0.48em;
  z-index: 2;
}

.embed {
  height: 1px;
}

#link {
  margin-top: 8vh;
  opacity: 1;
  cursor: pointer;
  display: flex;
  gap: 0.5rem;
  height: 24px;
  z-index: 1;
  color: #777;
}
#link svg {
  fill: #1DA1F2;
}

.explanation {
  position: absolute;
  top: 10px;
  right: 10px;
  display: flex;
  flex-direction: row;
  gap: 0.4rem;
}
</style>

<script>
let slider = document.getElementById('rangeslider'),
    knobVal = document.getElementsByClassName('knobVal')[0];

slider.addEventListener('input', (e) => {
  rotateKnob(e.target.value, e);
})

function rotateKnob(val) {
  
  let mapped = utils.map(val, 0, 100, 0, 270);
  // console.log(e.target.value, mapped);
  knobVal.innerHTML = val; //e.target.value;
  knobVal.classList.add('active');
  setCustomProp('angle', mapped, 'deg');
  setTimeout(() => {
    // console.log("Delayed for 1 second.");
    knobVal.classList.remove('active');
  }, "1000");
}


function setCustomProp(prop, val, unit = "") {  
  // document.documentElement.style.setProperty("--" + prop, val + unit);
  slider.style.setProperty("--" + prop, val + unit);
}


// explanation toggle
document.getElementById('exp').addEventListener('input', (e)=>{
  // console.log(e.target.checked)
  if(e.target.checked) {
    setCustomProp('opacityExp', .4)
  } else {
    setCustomProp('opacityExp', 1)
  }
})

// add WebMIDI

// start talking to MIDI controller
if (navigator.requestMIDIAccess) {
  navigator
    .requestMIDIAccess({
      sysex: false
    })
    .then(onMIDISuccess, onMIDIFailure);
} else {
  console.warn("No MIDI support in your browser");
}

// on success
function onMIDISuccess(midiData) {
  var allInputs = midiData.inputs.values();
  console.log("allInputs", allInputs);
  // loop over all available inputs and listen for any MIDI input
  for (
    var input = allInputs.next();
    input && !input.done;
    input = allInputs.next()
  ) {
    // MIDI msg received, call onMIDIMessage fn
    input.value.onmidimessage = gotMIDImessage;
  }
}
// on failure
function onMIDIFailure() {
  console.warn("Not recognising MIDI controller");
}

function gotMIDImessage(messageData) {
  console.log(messageData.data);
  if (messageData.data[0] === 192) {
    // knob
    console.log("rotary", messageData.data);
  }
  if (isInRange(midiSliders, messageData.data[1])) {
    // console.log("is slider", messageData.data[1], messageData.data[2]);
    midiObj.midiSliders[messageData.data[1]] = messageData.data[2];
  }
  if (isInRange(midiKnobs, messageData.data[1])) {
    // console.log("is knob", messageData.data[1], messageData.data[2]);
    midiObj.midiKnobs[messageData.data[1]] = messageData.data[2];
  }
  if (isInRange(midiButtons, messageData.data[1])) {
    // console.log("is button", messageData.data[1], messageData.data[2]);
    midiObj.midiButtons[messageData.data[1]] = messageData.data[2];
  }

  console.log(midiObj);
  // updateSliders();
  updateKnobs();
}

// update
function updateSliders() {
  // console.log({ midiObj });
  slidersDiv.innerHTML = ""; // clear container
  Object.entries(midiObj.midiSliders).forEach(([k, v], index) => {
    // console.log(k, v);
    newDiv = document.createElement("div");
    newDiv.id = "slider" + k;
    newDiv.style.backgroundColor = `hsl(${(Number(k) * 360) / 9}, ${v / 2}%, ${
      90 - v / 3
    }%)`;
    newDiv.innerText = k - midiSliders[0] + " " + v;
    newDiv.style.width = map(v, 0, 127, 0, 100) + "%";
    slidersDiv.appendChild(newDiv);
  });
}

// helper
function isInRange(arr, val) {
  if (val >= arr[0] && val <= arr[1]) {
    return true;
  } else {
    return false;
  }
}

function norm(value, min, max) {
  return (value - min) / (max - min);
}

function lerp(norm, min, max) {
  return (max - min) * norm + min;
}
function map(value, sourceMin, sourceMax, destMin, destMax) {
  return lerp(norm(value, sourceMin, sourceMax), destMin, destMax);
}
