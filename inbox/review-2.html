const LS_KEY = 'inbox-review-decisions-2';
let decisions = {};
try{ decisions = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); }catch(e){}
let idx = 0;
const $ = id => document.getElementById(id);
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(decisions)); }
function stats(){
  const k = Object.values(decisions).filter(d=>d==='keep').length;
  const d = Object.values(decisions).filter(d=>d==='del').length;
  $('progress').textContent = '共 '+MANIFEST.length+' · 保留 '+k+' · 删除 '+d+' · 未审 '+(MANIFEST.length-k-d);
}
function renderList(){
  $('items').innerHTML = MANIFEST.map((e,i)=>{
    const st = decisions[e.file]||'';
    return '<div class="item '+st+(i===idx?' cur':'')+'" data-i="'+i+'"><span class="dot"></span><span class="t">'+String(e.title).replace(/</g,'&lt;')+'</span></div>';
  }).join('');
  const cur = $('items').querySelector('.cur');
  if(cur) cur.scrollIntoView({block:'nearest'});
}
function show(i){
  idx = Math.max(0, Math.min(MANIFEST.length-1, i));
  const e = MANIFEST[idx];
  $('curTitle').textContent = (idx+1)+'/'+MANIFEST.length+' · '+e.title;
  $('curAuthor').textContent = e.author + ' · ' + e.categoryGuess;
  $('curSrc').href = e.source;
  $('frame').src = e.file.replace(/^inbox\//, '');
  renderList(); stats();
}
function mark(v){ decisions[MANIFEST[idx].file]=v; save(); show(idx+1); }
$('bKeep').onclick = ()=>mark('keep');
$('bDel').onclick = ()=>mark('del');
$('bSkip').onclick = ()=>mark('skip');
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight') mark('keep');
  else if(e.key==='ArrowLeft') mark('del');
  else if(e.key==='ArrowDown'){ e.preventDefault(); mark('skip'); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); show(idx-1); }
});
$('items').onclick = e=>{
  const it = e.target.closest('.item');
  if(it) show(+it.dataset.i);
};
$('bExport').onclick = ()=>{
  const blob = new Blob([JSON.stringify(decisions,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'decisions-2.json';
  a.click();
};
const firstPending = MANIFEST.findIndex(e=>!decisions[e.file]);
show(firstPending>=0?firstPending:0);
</script>
