<title>garden - three.js - animate a mesh on a sphere’s surface - animate along path - v2</title>
<style>

  box-sizing: border-box;
  min-width: 0;
  margin: 0;

body {

  cursor: grab;
}

<body>
<body>
  <div class="sceneParent"></div>
</body>

<script type="module">
import * as THREE from 'https://esm.sh/https://esm.sh/three';
import { OrbitControls } from 'https://esm.sh/https://esm.sh/three/examples/jsm/controls/OrbitControls';
import GUI from 'https://esm.sh/https://esm.sh/lil-gui';
import gsap from 'https://esm.sh/https://esm.sh/gsap';
import { Line2 } from 'https://esm.sh/https://esm.sh/three/examples/jsm/lines/Line2';
import { LineGeometry } from 'https://esm.sh/https://esm.sh/three/examples/jsm/lines/LineGeometry';
import { LineMaterial } from 'https://esm.sh/https://esm.sh/three/examples/jsm/lines/LineMaterial';

const viewportData = getViewportData();

const config = {
  classNames: {
    sceneParent: "sceneParent"
  },
  viewport: viewportData,
  scene: {
    backgroundColor: "hsl(0, 0%, 93%)"
  },
  camera: {
    left: viewportData.width / -2,
    right: viewportData.width / 2,
    top: viewportData.height / 2,
    bottom: viewportData.height / -2,
    near: -500,
    far: 500,
    aspect: viewportData.aspectRatio,
    position: [0, 0, -1],
    lookAt: [0, 0, 0]
  },
  meshes: {
    sphere: { position: [0, 0, 0], color: "hsl(0, 0%, 11%)", radius: 160 },
    marker: { color: "red", radius: 4 },
    path: { color: "red", width: 2 },
    box: { color: "red", width: 16, height: 12, depth: 32 }
  },
  path: {
    start: {
      latitude: 34,
      longitude: 56
    },
    end: {
      latitude: -12,
      longitude: 136
    }
  },
  gui: {
    offsetGeometryOrigin: true
  }
};

function getViewportData() {
  return {
    width: window.innerWidth,
    height: window.innerHeight,
    pixelRatio: Math.min(window.devicePixelRatio, 2)
  };
}

function createScene() {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(config.scene.backgroundColor);
  return scene;
}

function createCamera() {
  const {
    left,
    right,
    top,
    bottom,
    near,
    far,
    aspect,
    position,
    lookAt
  } = config.camera;
  const camera = new THREE.OrthographicCamera(
    left,
    right,
    top,
    bottom,
    near,
    far
  );
  camera.position.set(...position);
  camera.lookAt(...lookAt);

  return camera;
}

function createRenderer(sceneParent) {
  const { width, height, pixelRatio } = config.viewport;
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(width, height);
  renderer.setPixelRatio(pixelRatio);

  sceneParent.appendChild(renderer.domElement);
  return renderer;
}

function createSphere() {
  const { radius, position, color } = config.meshes.sphere;

  const geometry = new THREE.SphereGeometry(radius, 32, 32);
  const material = new THREE.MeshBasicMaterial({
    color,
    wireframe: true
  });
  const sphere = new THREE.Mesh(geometry, material);
  sphere.position.set(...position);

  return sphere;
}

function latLongToVector3({
  latitude,
  longitude,
  radius = config.meshes.sphere.radius,
  center = new THREE.Vector3(...config.meshes.sphere.position)
}) {
  const { sin, cos, PI } = Math;
  const phi = (90 - latitude) * (PI / 180);
  const theta = (longitude + 180) * (PI / 180);

  const x = -radius * sin(phi) * cos(theta);
  const y = radius * cos(phi);
  const z = radius * sin(phi) * sin(theta);

  return new THREE.Vector3(x, y, z).add(center);
}

function createMarker({ longitude, latitude }) {
  const { radius, color } = config.meshes.marker;

  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(radius, 16, 16),
    new THREE.MeshBasicMaterial({ color })
  );
  const position = latLongToVector3({ latitude, longitude });
  mesh.position.copy(position);

  return mesh;
}

function setOriginYBottom(geometry) {
  // Populate the .boundingBox property (three.js doesn't do this automatically)
  geometry.computeBoundingBox();
  // The lowest Y value of all vertices in the geometry.
  const yOffset = -geometry.boundingBox.min.y;
  geometry.translate(0, yOffset, 0);
}

function setOriginYCenter(geometry) {
  const centerY =
    (geometry.boundingBox.min.y + geometry.boundingBox.max.y) / -2;

  geometry.translate(0, centerY, 0);
  geometry.attributes.position.needsUpdate = true;
}

function createBox() {
  const { width, height, depth, color } = config.meshes.box;

  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(width, height, depth),
    new THREE.MeshBasicMaterial({ color, wireframe: true })
  );
  setOriginYBottom(mesh.geometry);
  const position = latLongToVector3(config.path.start);
  mesh.position.copy(position);

  const axesHelper = new THREE.AxesHelper(128);
  mesh.add(axesHelper);

  return mesh;
}

function createMeshes() {
  return {
    sphere: createSphere(),
    markerA: createMarker(config.path.start),
    markerB: createMarker(config.path.end),
    box: createBox()
  };
}

function initControls({ camera, renderer }) {
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  controls.addEventListener("start", () => {
    renderer.domElement.style.cursor = "grabbing";
  });

  controls.addEventListener("end", () => {
    renderer.domElement.style.cursor = "grab";
  });

  return controls;
}

// Generate a series of points along the shortest path (great circle arc) on a sphere surface between two points (start and end) on that sphere.
function calcPathPoints({
  start,
  end,
  center = new THREE.Vector3(...config.meshes.sphere.position),
  radius = config.meshes.sphere.radius,
  segments = 64
}) {
  const points = [];

  // Moves the start and end points so the sphere center becomes the origin (0, 0, 0). This makes it easier to work with rotations.
  const startLocal = start.clone().sub(center);
  const endLocal = end.clone().sub(center);

  // Convert vectors into unit vectors — pointing from the sphere center to the surface point.
  const startNorm = startLocal.normalize();
  const endNorm = endLocal.normalize();

  // The rotation that rotates startNorm onto endNorm.
  // Like an "arc" that takes you from the start direction to the end direction.
  const quaternion = new THREE.Quaternion().setFromUnitVectors(
    startNorm,
    endNorm
  );

  // Loop runs from t=0 (start point) to t=1 (end point)
  for (let i = 0; i <= segments; i++) {
    const t = i / segments;

    // Interpolate rotation between no rotation (identity) and full rotation (quaternion)
    const stepQuat = new THREE.Quaternion().slerpQuaternions(
      new THREE.Quaternion(), // identity quaternion
      quaternion,
      t
    );

    // Rotate the start vector by the interpolated quaternion
    // Rotates the start vector gradually towards the end vector along the great circle path.
    const pointLocal = startNorm
      .clone()
      .applyQuaternion(stepQuat)
      // Multiplying by radius scales the unit vector back to the sphere’s radius.
      .multiplyScalar(radius);

    // Translates the point back to the original sphere’s position in world space
    const pointWorld = pointLocal.add(center);

    points.push(pointWorld);
  }

  return points;
}

function createPath({ start, end }) {
  const { width, color } = config.meshes.path;
  const points = calcPathPoints({ start, end });

  const mesh = new Line2(
    new LineGeometry().setFromPoints(points),
    new LineMaterial({
      color,
      linewidth: width, // in world units
      resolution: new THREE.Vector2(
        config.viewport.width,
        config.viewport.height
      ),
      dashed: false
    })
  );
  mesh.computeLineDistances();

  return { points, path: mesh };
}

// For a mesh travelling along a path positioned on a sphere's surface,
// return the orientation of the mesh at any at point <t> from 0 (start) to 1 (end).
// This orientation will make the mesh:
// - sit upright on the sphere surface (y-axis pointing away from center)
// - face forward along the path (z-axis tangent to the path)
function calcMeshQuaterionAlongPath({
  spline,
  point,
  t,
  sphereCenter = new THREE.Vector3(...config.meshes.sphere.position)
}) {
  // Create a unit vector that points forward (along the direction of movement) using the tangent at time 't' along the spline.
  // We'll use this so the mesh's +Z points toward the target.
  // Making the mesh face fowards as it travels the spline.
  const forward = spline.getTangent(t).normalize();
  // Create a unit vector from the center of the sphere to the mesh’s position.
  // A normal vector. Indicates which direction a surface is facing.
  // We'll use this so the mesh's +Y points away from the center of the sphere.
  // Making the mesh sit up-right on the surface of the sphere.
  const up = point.clone().sub(sphereCenter).normalize();
  // Calculate a vector to use for the mesh's +X by calculating a direction perpendicular to both up and forward.
  // Required for creating a rotation matrix.
  const right = new THREE.Vector3().crossVectors(up, forward).normalize();

  // Recompute forward to ensure orthogonality
  // Due to floating-point errors, the forward vector may be misaligned after calculating up and right.
  // This ensures the forward vector is perpendicular to both right and up.
  const correctedForward = new THREE.Vector3()
    .crossVectors(right, up)
    .normalize();

  const rotationMatrix = new THREE.Matrix4().makeBasis(
    right, // X axis
    up, // Y axis
    correctedForward // Z axis
  );

  // Convert rotationMatrix to quaternion
  return new THREE.Quaternion().setFromRotationMatrix(rotationMatrix);
}

// Return a function that returns the Matrix4 transformation of a mesh moving across the surface of a sphere (at any point <t>).
function createSphereSpaceInterpolator({
  startWorldMatrix,
  endWorldMatrix,
  sphereCenter = new THREE.Vector3(...config.meshes.sphere.position)
}) {
  // Calculate start and end positions in sphere space using world positions.
  // (vectors from sphere center to the mesh)
  const startPos = new THREE.Vector3()
    .setFromMatrixPosition(startWorldMatrix)
    .sub(sphereCenter);
  const endPos = new THREE.Vector3()
    .setFromMatrixPosition(endWorldMatrix)
    .sub(sphereCenter);

  // Extract start and end rotations
  const startQuat = new THREE.Quaternion().setFromRotationMatrix(
    startWorldMatrix
  );
  const endQuat = new THREE.Quaternion().setFromRotationMatrix(endWorldMatrix);

  // Define a curved path on the sphere
  const arcQuat = new THREE.Quaternion().setFromUnitVectors(
    startPos.clone().normalize(),
    endPos.clone().normalize()
  );

  return (t) => {
    // Interpolate position along the arc
    const stepQuat = new THREE.Quaternion().slerpQuaternions(
      new THREE.Quaternion(), // identity quaternion
      arcQuat,
      t
    );
    const interpPos = startPos
      .clone()
      .applyQuaternion(stepQuat)
      .add(sphereCenter);

    // Interpolate orientation (rotation)
    const interpQuat = new THREE.Quaternion().slerpQuaternions(
      startQuat,
      endQuat,
      t
    );

    // Combine position, rotation and scale into a matrix4 transformation
    return new THREE.Matrix4().compose(
      interpPos,
      interpQuat,
      new THREE.Vector3(1, 1, 1)
    );
  };
}

function animateMeshAlongPath({ mesh, path, points }) {
  // Creates a smooth spline that passes through all points.
  // Allowing us to interpolate any position between them.
  const spline = new THREE.CatmullRomCurve3(points);

  const startPoint = points[0];
  const endPoint = points[points.length - 1];

  // Calculate the orientation (rotation) of the mesh at the start and end of the path.
  // We'll interpolate between these during the animation.
  const startQuat = calcMeshQuaterionAlongPath({
    point: startPoint,
    t: 0,
    spline
  });
  const endQuat = calcMeshQuaterionAlongPath({ point: endPoint, t: 1, spline });

  // Calculate the Matrix4 transformation of the mesh at the start and end of the path.
  // (matrix4 combines position, rotation and scale)
  const startMatrix = new THREE.Matrix4().compose(
    startPoint,
    startQuat,
    new THREE.Vector3(1, 1, 1)
  );
  const endMatrix = new THREE.Matrix4().compose(
    endPoint,
    endQuat,
    new THREE.Vector3(1, 1, 1)
  );

  // Create a function that can return a Matrix4 transformation at any point along the path
  const interpolateMatrix = createSphereSpaceInterpolator({
    startWorldMatrix: startMatrix,
    endWorldMatrix: endMatrix
  });

  const tweenTarget = { t: 0 };

  gsap.to(tweenTarget, {
    t: 1,
    duration: 5,
    ease: "power1.inOut",
    onUpdate: () => {
      const t = tweenTarget.t;
      const matrix = interpolateMatrix(t);

      mesh.matrix.copy(matrix);
      // Prevent three.js recalculating the matrix on the next frame.
      // We don't need it because we have manual control of position, rotation and scale.
      mesh.matrixAutoUpdate = false;
    },
    repeat: -1,
    yoyo: true
  });
}

function onNewFrame({ renderer, scene, camera, controls }) {
  controls.update();
  renderer.render(scene, camera);
}

function onResize({ camera, renderer, path }) {
  const { width, height } = getViewportData();

  camera.left = width / -2;
  camera.right = width / 2;
  camera.top = height / 2;
  camera.bottom = height / -2;

  camera.updateProjectionMatrix();
  renderer.setSize(width, height);

  path.material.resolution.set(width, height);
}

function initCanvas3d() {
  const sceneParent = document.querySelector(
    `.${config.classNames.sceneParent}`
  );

  if (!sceneParent) {
    throw new Error(`Element not found`);
  }

  const scene = createScene();
  const camera = createCamera();
  const renderer = createRenderer(sceneParent);
  const { sphere, markerA, markerB, box } = createMeshes();
  const { points, path } = createPath({
    start: markerA.position,
    end: markerB.position
  });
  const controls = initControls({ camera, renderer });

  scene.add(sphere, markerA, markerB, box, path);

  animateMeshAlongPath({ mesh: box, path, points });

  renderer.setAnimationLoop(() => {
    onNewFrame({ renderer, scene, camera, controls });
  });

  window.addEventListener("resize", () => onResize({ camera, renderer, path }));

  return { box };
}

function initGui({ box }) {
  const gui = new GUI();
  gui.add(config.gui, "offsetGeometryOrigin").onChange((value) => {
    value ? setOriginYBottom(box.geometry) : setOriginYCenter(box.geometry);
  });
}

function init() {
  const { box } = initCanvas3d();
  initGui({ box });
}

init();
</script>
</body>
</html>
