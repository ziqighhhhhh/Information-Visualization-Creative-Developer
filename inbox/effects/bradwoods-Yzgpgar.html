<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>garden - preserve-3d</title>
<style>
:root {
	--black: hsl(0, 0%, 11%);
	--time: 500ms;
}

*,
::before,
::after {
	box-sizing: border-box;
	padding: 0;
	margin: 0;
}

body {
	width: 100%;
	max-width: 640px;
	padding: 16px;

	display: flex;
	flex-direction: column;
	gap: 16px;
}

button {
	height: 44px;
	padding: 0 16px;

	color: white;
	background: hsl(0, 0%, 11%);
	border: none;
	cursor: pointer;
}

#parent {
	width: 100%;
	aspect-ratio: 2/1;

	perspective: 1000px;
}

#child {
	width: 100%;
	height: 100%;

	position: relative;

	perspective: 1000px;
	transform-style: preserve-3d;
	transition: transform var(--time);

	border: 1px solid var(--black);
}

#parent[data-rotate="true"] #child {
	transform: translate3d(0, 0, -200px) rotateX(71deg) rotateY(-10deg)
		rotateZ(60deg);
}

.grandChild {
	width: 20%;
	aspect-ratio: 3/1;

	position: absolute;
	top: 8px;
	right: 8px;

	border: 1px solid var(--black);
	transition: transform var(--time);
}

#parent[data-rotate="true"] .grandChild {
	transition-delay: var(--time);
}

#parent[data-rotate="true"] .grandChild:nth-child(2) {
	transform: translate3d(0, 0, 20px);
}

#parent[data-rotate="true"] .grandChild:nth-child(3) {
	transform: translate3d(0, 0, 40px);
}
</style>
</head>
<body>
<div id="parent">
	<div id="child">
		<div class="grandChild"></div>
		<div class="grandChild"></div>
		<div class="grandChild"></div>
	</div>
</div>

<button type="button">Toggle</button>

<script>
const button = document.querySelector("button");
const parent = document.querySelector("#parent");

let isRotate = false;

function toggle() {
	isRotate = !isRotate;
	parent.setAttribute("data-rotate", isRotate);
}

button.onclick = toggle;
</script>
</body>
</html>
