<script>
console.clear();
/* *************************************** */
/* ************************************** */
var floaters = function(elements, container) {
		
	// If no container given, use window size?
	var stage = getSize(container);

	//
	var plates = {};
	var depth = Math.abs(elements.depth) || 2;
	var dur = stage.width / 4 / (Math.abs(elements.speed) || 1);
	
		
	// Get all elements in the background
	if(elements.bg) {
		plates.bg = createTweens(elements.bg.target, 1/depth, elements.bg.ordered);
	}
	
	if(elements.mg) {
		plates.mg = createTweens(elements.mg.target, 1, elements.mg.ordered);
	}
	
	if(elements.fg) {
		plates.fg = createTweens(elements.fg.target, depth, elements.fg.ordered);
	}
	
		
	window.addEventListener('resize', _throttle(resize, 50));

	
	
	
	/* ******************* */
	/* Main Tweening setup */
	/* ******************* */
	function createTweens(targets, depth, ordered) {
		var array = selectAllElements(targets);
		var ttl = array.length;
		var result = [];		
		
		for(var i = 0; i < ttl; i++) {
			if(ordered) {
				// Spread the elements along the length of the tween
				result.push(createTween(array[i], depth, (i+1) * (1 / ttl)));
			} else {
				result.push(createTween(array[i], depth));				
			}
		}
		
		return result;
	}
	
	
	function createTween(el, depth, progress) {
		var t;
				
		if(elements.vertical) {
			
			t = TweenMax.fromTo(el, dur,
				{
					y: -getSize(el).height,
					rotation: 0
				},
				{ 
					y: stage.height,
					rotation: 0.1, // To force 3D transforms
					ease: Linear.easeNone,
					onComplete:function() {
						t.restart();
					},
					onReverseComplete:function() {
						t.seek(t.totalDuration(), true);
					}
				}
			);
			
		} else {
			
			t = TweenMax.fromTo(el, dur,
				{
					x: -getSize(el).width,
					rotation: 0
				},
				{ 
					x: stage.width,
					rotation: 0.1, // To force 3D transforms
					ease: Linear.easeNone,
					onComplete:function() {
						t.restart();
					},
					onReverseComplete:function() {
						t.seek(t.totalDuration(), true);
					}
				}
			);
		}

		if(progress) {
			// Only supress events if playing the animation backwards
			t.progress(progress, elements.reversed);
		} else {
			t.progress(Math.random());				
		}
						
		// Adjust the speed according to the distance
		if(elements.depth) {
			t.timeScale(depth);			
		}
		
		// Play backwards if reversed
		if(elements.reversed) {
			t.reverse()
		}
		
		// t.pause();
								
		return t;
	}
	
	
	function updateTweens(plate, depth) {
		var temp = [];

		for(var i = 0; i < plate.length; i++) {
			var tween = plate[i];
			// Record the tween's progress
			var progress = tween.progress();
			// Reset and recreate the tween
			tween.pause(0);

			temp.push(createTween(tween.target, depth, progress));			
		}

		return temp;
	}

		


	/* **************** */
	/* Helper functions */
	/* **************** */
	function getSize(target) {		
		var trg = (
			document.getElementById(target.id)
			||
			document.getElementsByClassName(target.className)[0]
			||
			document.getElementsByTagName(target)[0]
			||
			document.querySelector(target)).getBoundingClientRect();

		return {
		  width: Math.round(trg.width),
		  height: Math.round(trg.height)
		};
	}
	
	
	function addArrays(array1, array2) {
		array1 = array2.reduce( function(collection, item) {
			collection.push(item);
			return collection;
		}, array1);
		
		return array1;
	}
	
	
	function resize() {
		// Update the stage's width
		stage =  getSize(container);
		
		if(elements.bg) {
			plates.bg = updateTweens(plates.bg, 1/depth)
		}
		if(elements.mg) {
			plates.mg = updateTweens(plates.mg, 1)
		}
		if(elements.fg) {
			plates.fg = updateTweens(plates.fg, depth)
		}
	}
		
	
	/* By the mighty grace of OSUBlake */
	/* http://codepen.io/osublake/ */
	function selectAllElements(selector, context) {
		var nodeList = (context || document).querySelectorAll(selector);
		var i = nodeList.length;
		var elements = new Array(i);
		while (i--) { elements[i] = nodeList[i]; }
		return elements;
	}
	
	
	/* 'Borrowed' from underscore */
	function _now() {
		return Date.now() || function() {
			return new Date().getTime();
		}
	}
	/* 'Borrowed' from underscore */
	function _throttle(func, wait, options) {
		var context, args, result;
		var timeout = null;
		var previous = 0;
		if (!options) options = {};
		var later = function() {
			previous = options.leading === false ? 0 : _now();
			timeout = null;
			result = func.apply(context, args);
			if (!timeout) context = args = null;
		};
		return function() {
			var now = _now();
			if (!previous && options.leading === false) previous = now;
				var remaining = wait - (now - previous);
				context = this;
				args = arguments;
				if (remaining <= 0 || remaining > wait) {
					if (timeout) {
					clearTimeout(timeout);
					timeout = null;
				}
					previous = now;
					result = func.apply(context, args);
					if (!timeout) context = args = null;
				} else if (!timeout && options.trailing !== false) {
					timeout = setTimeout(later, remaining);
			}
			return result;
		};
	};
	

	return plates;
};
