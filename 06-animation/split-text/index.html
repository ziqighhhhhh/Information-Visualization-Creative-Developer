<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Split Text Reveal — Reusable Asset</title>

<style>
  :root{
    --bg:#080b10;
    --panel:#0f141b;
    --line:rgba(255,255,255,.08);
    --text:#f5f7fa;
    --muted:#7f8b98;
    --accent:#ff7a16;
  }

  *{box-sizing:border-box}

  html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 46%,rgba(255,122,22,.055),transparent 25%),
      linear-gradient(180deg,#090d12,#06080c 72%);
    color:var(--text);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }

  body{
    display:grid;
    place-items:center;
  }

  .stage{
    position:relative;
    width:min(1180px,100vw);
    height:min(760px,100vh);
    padding:34px;
    display:grid;
    grid-template-rows:auto 1fr auto;
  }

  .topbar{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:24px;
  }

  .eyebrow{
    margin-bottom:8px;
    color:var(--accent);
    font-size:10px;
    font-weight:800;
    letter-spacing:.18em;
    text-transform:uppercase;
  }

  h1{
    margin:0;
    font-size:18px;
    font-weight:680;
    letter-spacing:-.02em;
  }

  .meta{
    color:var(--muted);
    font-size:10px;
    line-height:1.6;
    text-align:right;
  }

  .hero{
    display:grid;
    place-items:center;
    min-height:0;
  }

  .copy{
    width:min(940px,90%);
    text-align:center;
  }

  .kicker{
    margin:0 0 20px;
    color:var(--muted);
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
  }

  .headline{
    margin:0 auto;
    max-width:980px;
    font-size:clamp(44px,7vw,96px);
    line-height:.94;
    font-weight:760;
    letter-spacing:-.055em;
    text-wrap:balance;
  }

  .headline .line{
    overflow:hidden;
    padding-bottom:.06em;
  }

  .headline .char,
  .headline .word{
    will-change:transform,opacity,filter;
  }

  .subline{
    width:min(680px,88%);
    margin:26px auto 0;
    color:#9aa5b1;
    font-size:clamp(13px,1.3vw,17px);
    line-height:1.55;
  }

  .subline .line{
    overflow:hidden;
  }

  .controls{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:9px;
    padding-top:18px;
    border-top:1px solid var(--line);
  }

  button,
  select{
    appearance:none;
    border:1px solid rgba(255,255,255,.10);
    border-radius:999px;
    background:rgba(255,255,255,.025);
    color:#dce4eb;
    padding:9px 13px;
    font:inherit;
    font-size:10px;
    letter-spacing:.05em;
    cursor:pointer;
  }

  button:hover,
  select:hover{
    background:rgba(255,255,255,.055);
    border-color:rgba(255,255,255,.18);
  }

  .accent-btn{
    border-color:rgba(255,122,22,.28);
    color:#ffd0aa;
    background:rgba(255,122,22,.07);
  }

  .accent-btn:hover{
    background:rgba(255,122,22,.12);
  }

  .hint{
    position:absolute;
    right:34px;
    bottom:26px;
    color:rgba(255,255,255,.24);
    font-size:9px;
    letter-spacing:.08em;
    text-transform:uppercase;
    pointer-events:none;
  }

  @media(max-width:700px){
    .stage{padding:20px}
    .meta{display:none}
    .headline{font-size:clamp(42px,15vw,72px)}
    .copy{width:96%}
    .hint{display:none}
  }
</style>
</head>

<body>
<main class="stage">

  <header class="topbar">
    <div>
      <div class="eyebrow">Effects / Text Reveal</div>
      <h1>Split Text Reveal</h1>
    </div>

    <div class="meta">
      SplitType + Anime.js<br>
      Reusable glue-layer API
    </div>
  </header>

  <section class="hero">
    <div class="copy">
      <p class="kicker reveal-sub">Brand Presentation System</p>

      <h2 class="headline reveal-title">
        Power Ideas Into Motion
      </h2>

      <p class="subline reveal-body">
        A reusable title animation asset for hero sections, product launches, brand storytelling and information visualization.
      </p>
    </div>
  </section>

  <footer class="controls">
    <select id="effectSelect" aria-label="Effect">
      <option value="rise">Rise</option>
      <option value="blur">Blur Focus</option>
      <option value="scale">Scale In</option>
      <option value="slide">Side Slide</option>
    </select>

    <select id="splitSelect" aria-label="Split mode">
      <option value="chars">Characters</option>
      <option value="words">Words</option>
      <option value="lines">Lines</option>
    </select>

    <button class="accent-btn" id="replayBtn">Replay</button>
    <button id="randomBtn">Randomize</button>
  </footer>

  <div class="hint">Edit only CONFIG when reusing</div>

</main>

<!-- Mature open-source dependencies -->
<script src="https://cdn.jsdelivr.net/npm/split-type@0.3.4/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>

<script>
/* ============================================================
   REUSE CONFIG
   Keep the engine stable; change only these values per page.
   ============================================================ */
const CONFIG = {
  target: ".reveal-title",
  split: "chars",       // chars | words | lines
  effect: "rise",       // rise | blur | scale | slide
  stagger: 34,
  duration: 760,
  delay: 160,
  easing: "easeOutExpo"
};


/* ============================================================
   SPLIT REGISTRY
   SplitType instances are reverted before every replay so the DOM
   doesn't become nested after repeated animation calls.
   ============================================================ */
const splitRegistry = new Map();

function splitTarget(target, splitMode) {
  const el = typeof target === "string"
    ? document.querySelector(target)
    : target;

  if (!el) return null;

  const previous = splitRegistry.get(el);

  if (previous) {
    previous.revert();
  }

  const types = splitMode === "chars"
    ? "lines, words, chars"
    : splitMode === "words"
    ? "lines, words"
    : "lines";

  const instance = new SplitType(el, { types });

  splitRegistry.set(el, instance);

  return instance;
}


/* ============================================================
   EFFECT PRESETS
   One stable asset; styling variants are presets, not new folders.
   ============================================================ */
const EFFECTS = {
  rise: {
    from: {
      translateY: "115%",
      opacity: 0
    },
    to: {
      translateY: "0%",
      opacity: 1
    }
  },

  blur: {
    from: {
      translateY: 14,
      opacity: 0,
      filter: "blur(14px)"
    },
    to: {
      translateY: 0,
      opacity: 1,
      filter: "blur(0px)"
    }
  },

  scale: {
    from: {
      scale: .72,
      opacity: 0,
      translateY: 16
    },
    to: {
      scale: 1,
      opacity: 1,
      translateY: 0
    }
  },

  slide: {
    from: {
      translateX: -38,
      opacity: 0
    },
    to: {
      translateX: 0,
      opacity: 1
    }
  }
};


/* ============================================================
   PUBLIC API
   This is the glue function you can reuse in other pages.
   ============================================================ */
function createTextReveal({
  target,
  split = "chars",
  effect = "rise",
  stagger = 34,
  duration = 760,
  delay = 0,
  easing = "easeOutExpo"
}) {

  const instance = splitTarget(
    target,
    split
  );

  if (!instance) return null;

  const items =
    split === "chars"
      ? instance.chars
      : split === "words"
      ? instance.words
      : instance.lines;

  const preset =
    EFFECTS[effect] || EFFECTS.rise;

  /*
    Apply initial state directly before running Anime.js.
  */
  anime.set(items, {
    ...preset.from
  });

  return anime({
    targets: items,
    ...preset.to,
    delay: anime.stagger(stagger, {
      start: delay
    }),
    duration,
    easing
  });
}


/* ============================================================
   SUPPORTING COPY
   Uses the same engine but separate timings.
   ============================================================ */
function animateSupportingCopy() {

  createTextReveal({
    target: ".reveal-sub",
    split: "words",
    effect: "blur",
    stagger: 24,
    duration: 580,
    delay: 80,
    easing: "easeOutCubic"
  });

  createTextReveal({
    target: ".reveal-body",
    split: "words",
    effect: "rise",
    stagger: 14,
    duration: 620,
    delay: 540,
    easing: "easeOutCubic"
  });
}


/* ============================================================
   DEMO RUNNER
   ============================================================ */
function runDemo() {

  anime.remove("*");

  createTextReveal({
    ...CONFIG,
    split: document.querySelector("#splitSelect").value,
    effect: document.querySelector("#effectSelect").value
  });

  animateSupportingCopy();
}


/* ============================================================
   CONTROLS
   ============================================================ */
document.querySelector("#replayBtn")
  .addEventListener("click",runDemo);

document.querySelector("#effectSelect")
  .addEventListener("change",runDemo);

document.querySelector("#splitSelect")
  .addEventListener("change",runDemo);

document.querySelector("#randomBtn")
  .addEventListener("click",() => {

    const effects =
      ["rise","blur","scale","slide"];

    const splits =
      ["chars","words","lines"];

    const randomEffect =
      effects[
        Math.floor(
          Math.random()*effects.length
        )
      ];

    const randomSplit =
      splits[
        Math.floor(
          Math.random()*splits.length
        )
      ];

    document.querySelector("#effectSelect").value =
      randomEffect;

    document.querySelector("#splitSelect").value =
      randomSplit;

    runDemo();
  });


/* ============================================================
   INITIAL PLAY
   ============================================================ */
window.addEventListener("load",() => {
  setTimeout(runDemo,120);
});


/* ============================================================
   HANDLE RESIZE
   Line splitting depends on actual text width, so we rebuild
   the split after the layout changes.
   ============================================================ */
let resizeTimer = null;

window.addEventListener("resize",() => {

  clearTimeout(resizeTimer);

  resizeTimer = setTimeout(
    runDemo,
    140
  );

});
</script>
</body>
</html>
