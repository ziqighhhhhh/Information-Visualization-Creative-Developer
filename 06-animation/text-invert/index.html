<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Invert text on scroll with CSS variable</title>
<style>
body {
  font-family: "proxima-nova", sans-serif;
  padding: 0;
  margin: 0;
}

#container {
  --target: 100%;
  width: 100%;
  background: linear-gradient(to right, #000 var(--target), #fff var(--target));
  display: flex;
  height: 100vh;
  justify-content: center;
  align-items: center;
}

h1 {
  color: white;
  font-size: clamp(2.5rem, 8vw, 6rem);
  text-align: center;
  letter-spacing: -0.02em;
  background: linear-gradient(to right, #fff var(--target), #000 var(--target));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  width: 100%;
  display: block;
  line-height: 0.95;
}
h1 span {
  font-size: 0.5em;
  display: block;
}
</style>
</head>
<body>
<main id="container">
  <h1>motiontricks.com <span>is super awesome!</span> </h1>
</main>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
console.clear();
gsap.config({ trialWarn: false });
gsap.registerPlugin(ScrollTrigger);
gsap.to("#container", {
  "--target": "0%",
  ease: "none",
  scrollTrigger: {
    trigger: "#container",
    markers: {
      startColor: "yellow",
      endColor: "#42a6e0",
      fontSize: "14px"
    },
    start: "top top",
    end: "+=1000",
    pin: true,
    scrub: 1
  }
});
</script>
</body>
</html>
