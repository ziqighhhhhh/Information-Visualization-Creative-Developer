<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Logo Reveal — Particle Assemble</title>

<style>
  :root{
    --bg:#05080d;
    --text:#f6f8fb;
    --muted:rgba(235,241,247,.54);
    --accent:#ff7a16;
  }

  *{box-sizing:border-box}

  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 50%,rgba(255,122,22,.05),transparent 26%),
      linear-gradient(180deg,#090d12,#05070b 72%);
    color:var(--text);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }

  .stage{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    isolation:isolate;
  }

  #scene{
    position:absolute;
    inset:0;
    z-index:0;
  }

  #scene canvas{
    display:block;
    width:100%;
    height:100%;
  }

  .grade{
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 50%,transparent 0 34%,rgba(0,0,0,.10) 66%,rgba(0,0,0,.46) 100%);
  }

  .ui{
    position:absolute;
    inset:0;
    z-index:5;
    display:grid;
    grid-template-rows:auto 1fr auto;
    padding:28px 30px;
    pointer-events:none;
  }

  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
  }

  .eyebrow{
    margin-bottom:7px;
    color:var(--accent);
    font-size:10px;
    font-weight:800;
    letter-spacing:.18em;
    text-transform:uppercase;
  }

  h1{
    margin:0;
    font-size:20px;
    font-weight:700;
    letter-spacing:-.025em;
  }

  .meta{
    text-align:right;
    color:rgba(255,255,255,.42);
    font-size:10px;
    line-height:1.55;
  }

  .copy{
    align-self:end;
    justify-self:center;
    margin-bottom:120px;
    text-align:center;
    pointer-events:none;
  }

  .copy .kicker{
    margin:0 0 8px;
    color:rgba(255,255,255,.38);
    font-size:9px;
    letter-spacing:.16em;
    text-transform:uppercase;
  }

  .copy p{
    margin:0;
    color:rgba(255,255,255,.30);
    font-size:10px;
  }

  .controls{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    pointer-events:auto;
  }

  button,
  select,
  .upload-label{
    appearance:none;
    border:1px solid rgba(255,255,255,.12);
    border-radius:999px;
    background:rgba(0,0,0,.25);
    color:rgba(255,255,255,.76);
    padding:9px 12px;
    font:inherit;
    font-size:10px;
    letter-spacing:.045em;
    cursor:pointer;
    backdrop-filter:blur(12px);
  }

  button:hover,
  select:hover,
  .upload-label:hover{
    color:#fff;
    background:rgba(255,255,255,.07);
    border-color:rgba(255,255,255,.24);
  }

  button.active,
  .primary{
    color:#fff;
    border-color:rgba(255,122,22,.36);
    background:rgba(255,122,22,.10);
  }

  input[type=file]{
    display:none;
  }

  .status{
    position:absolute;
    left:30px;
    bottom:30px;
    z-index:7;
    color:rgba(255,255,255,.28);
    font-size:9px;
    letter-spacing:.08em;
    text-transform:uppercase;
    pointer-events:none;
  }

  @media(max-width:760px){
    .ui{padding:20px}
    .meta{display:none}
    .copy{margin-bottom:160px}
    .controls{align-content:flex-end}
    .status{display:none}
  }
</style>
</head>

<body>
<main class="stage">

  <div id="scene"></div>
  <div class="grade"></div>

  <div class="ui">
    <header class="topbar">
      <div>
        <div class="eyebrow">Logo Reveal / Particle Assemble</div>
        <h1>Particle Assemble</h1>
      </div>

      <div class="meta">
        Three.js + SVGLoader + Anime.js<br>
        SVG path → point cloud → morph
      </div>
    </header>

    <section class="copy">
      <p class="kicker">Reusable Logo Formation</p>
      <p>Scatter → flow → assemble → hold</p>
    </section>

    <footer class="controls">
      <button data-shape="mark" class="active">Mark</button>
      <button data-shape="star">Star</button>
      <button data-shape="bolt">Bolt</button>
      <button data-shape="heart">Heart</button>

      <select id="densitySelect">
        <option value="900">900 pts</option>
        <option value="1500" selected>1500 pts</option>
        <option value="2400">2400 pts</option>
      </select>

      <select id="motionSelect">
        <option value="soft">Soft Flow</option>
        <option value="swirl" selected>Swirl</option>
        <option value="impact">Impact</option>
      </select>

      <label class="upload-label">
        Upload SVG
        <input id="svgUpload" type="file" accept=".svg,image/svg+xml">
      </label>

      <button id="scatterBtn">Scatter</button>
      <button class="primary" id="assembleBtn">Assemble</button>
    </footer>
  </div>

  <div class="status" id="status">Ready</div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/loaders/SVGLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>

<script>
/* ============================================================
   BUILT-IN SVG SOURCES
   Any uploaded SVG can replace these without changing the engine.
   ============================================================ */
const SHAPES = {

  mark: `
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420">
    <path fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"
      d="
        M130 318 L205 102 L280 318
        M171 210 L245 210
        M350 318 L350 102
        M350 102 L500 318
        M500 318 L500 102
      "/>
    <path fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round"
      d="M560 110 C625 145 625 275 560 310"/>
  </svg>`,

  star: `
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
    <path fill="none" stroke="#fff" stroke-width="12" stroke-linejoin="round"
      d="M300 58 L366 224 L544 236 L407 349 L451 522
         L300 430 L149 522 L193 349 L56 236 L234 224 Z"/>
  </svg>`,

  bolt: `
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700">
    <path fill="none" stroke="#fff" stroke-width="14" stroke-linejoin="round"
      d="M286 40 L92 394 L228 394 L187 662 L411 296 L268 296 Z"/>
  </svg>`,

  heart: `
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 620">
    <path fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"
      d="M350 558
         C300 505 106 389 106 216
         C106 118 184 70 261 70
         C311 70 340 99 350 127
         C360 99 389 70 439 70
         C516 70 594 118 594 216
         C594 389 400 505 350 558 Z"/>
  </svg>`
};


/* ============================================================
   CONFIG
   ============================================================ */
const CONFIG = {
  particleCount: 1500,
  shape: "mark",
  motion: "swirl",

  colors: [
    0xff7a16,
    0xffa23f,
    0xffcc7d,
    0xfff2df
  ],

  pointSize: 10
};


/* ============================================================
   THREE.JS SETUP
   ============================================================ */
const mount = document.querySelector("#scene");

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  42,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);

camera.position.z = 8;

const renderer = new THREE.WebGLRenderer({
  antialias:true,
  alpha:true
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio || 1,2)
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.outputEncoding = THREE.sRGBEncoding;

mount.appendChild(
  renderer.domElement
);


/* ============================================================
   ROUND PARTICLE TEXTURE
   Keeps us on standard THREE.PointsMaterial rather than inventing
   a custom particle shader.
   ============================================================ */
function makeParticleTexture(){

  const canvas =
    document.createElement("canvas");

  canvas.width =
    canvas.height =
    64;

  const ctx =
    canvas.getContext("2d");

  const gradient =
    ctx.createRadialGradient(
      32,32,0,
      32,32,32
    );

  gradient.addColorStop(
    0,
    "rgba(255,255,255,1)"
  );

  gradient.addColorStop(
    .18,
    "rgba(255,238,215,.95)"
  );

  gradient.addColorStop(
    .48,
    "rgba(255,139,35,.36)"
  );

  gradient.addColorStop(
    1,
    "rgba(255,122,22,0)"
  );

  ctx.fillStyle =
    gradient;

  ctx.fillRect(
    0,0,64,64
  );

  const texture =
    new THREE.CanvasTexture(
      canvas
    );

  return texture;
}


const geometry =
  new THREE.BufferGeometry();

const material =
  new THREE.PointsMaterial({
    size:.085,
    map:makeParticleTexture(),
    transparent:true,
    depthWrite:false,
    blending:THREE.AdditiveBlending,
    vertexColors:true,
    opacity:.96,
    sizeAttenuation:true
  });

const points =
  new THREE.Points(
    geometry,
    material
  );

scene.add(
  points
);


/* ============================================================
   DATA BUFFERS
   ============================================================ */
let currentSvg =
  SHAPES[CONFIG.shape];

let particleCount =
  CONFIG.particleCount;

let currentPositions =
  new Float32Array(
    particleCount * 3
  );

let startPositions =
  new Float32Array(
    particleCount * 3
  );

let targetPositions =
  new Float32Array(
    particleCount * 3
  );

let curveOffsets =
  new Float32Array(
    particleCount * 3
  );

let animationProxy =
  { t:0 };

let activeAnimation =
  null;


/* ============================================================
   SVG → SUBPATHS
   Mature SVG parsing is delegated to THREE.SVGLoader.
   ============================================================ */
function parseSubPaths(svgText){

  const loader =
    new THREE.SVGLoader();

  const data =
    loader.parse(
      svgText
    );

  const result = [];

  data.paths.forEach(
    path => {

      path.subPaths.forEach(
        subPath => {

          const length =
            subPath.getLength();

          if(
            Number.isFinite(length) &&
            length > 0
          ){
            result.push({
              path:subPath,
              length
            });
          }
        }
      );
    }
  );

  return result;
}


/* ============================================================
   SAMPLE TARGET POINTS PROPORTIONALLY BY PATH LENGTH
   ============================================================ */
function buildTargetPositions(
  svgText,
  count
){

  const subPaths =
    parseSubPaths(
      svgText
    );

  if(!subPaths.length){
    throw new Error(
      "No usable SVG paths found."
    );
  }

  const totalLength =
    subPaths.reduce(
      (sum,item) =>
        sum + item.length,
      0
    );

  const raw = [];

  subPaths.forEach(
    (item,index) => {

      const share =
        item.length /
        totalLength;

      const n =
        index === subPaths.length - 1
          ? count - raw.length
          : Math.max(
              2,
              Math.round(
                count * share
              )
            );

      for(
        let i=0;
        i<n;
        i++
      ){

        const p =
          item.path.getPointAt(
            i /
            Math.max(
              n - 1,
              1
            )
          );

        raw.push({
          x:p.x,
          y:p.y
        });
      }
    }
  );


  /*
    Normalize into centered scene coordinates.
  */
  let minX=Infinity;
  let maxX=-Infinity;
  let minY=Infinity;
  let maxY=-Infinity;

  raw.forEach(p => {
    minX=Math.min(minX,p.x);
    maxX=Math.max(maxX,p.x);
    minY=Math.min(minY,p.y);
    maxY=Math.max(maxY,p.y);
  });

  const cx =
    (minX+maxX)/2;

  const cy =
    (minY+maxY)/2;

  const span =
    Math.max(
      maxX-minX,
      maxY-minY
    );

  const scale =
    5.1 /
    Math.max(
      span,
      1
    );

  const output =
    new Float32Array(
      count * 3
    );

  for(
    let i=0;
    i<count;
    i++
  ){

    const p =
      raw[
        i % raw.length
      ];

    output[i*3] =
      (p.x-cx) *
      scale;

    output[i*3+1] =
      -(p.y-cy) *
      scale;

    output[i*3+2] =
      (Math.random()-.5) *
      .05;
  }

  return output;
}


/* ============================================================
   SCATTER FIELD
   ============================================================ */
function buildScatterPositions(
  count,
  motion
){

  const output =
    new Float32Array(
      count * 3
    );

  for(
    let i=0;
    i<count;
    i++
  ){

    const angle =
      Math.random() *
      Math.PI *
      2;

    const radius =
      motion === "impact"
        ? 2.8 +
          Math.random()*4.8
        : 2.0 +
          Math.random()*5.2;

    const y =
      (Math.random()-.5) *
      5.4;

    output[i*3] =
      Math.cos(angle) *
      radius;

    output[i*3+1] =
      y;

    output[i*3+2] =
      (Math.random()-.5) *
      3.0;
  }

  return output;
}


function buildCurveOffsets(
  count,
  motion
){

  const output =
    new Float32Array(
      count * 3
    );

  for(
    let i=0;
    i<count;
    i++
  ){

    const strength =
      motion === "soft"
        ? .34
        : motion === "impact"
        ? .72
        : 1.05;

    output[i*3] =
      (Math.random()-.5) *
      strength *
      2.4;

    output[i*3+1] =
      (Math.random()-.5) *
      strength *
      2.0;

    output[i*3+2] =
      (Math.random()-.5) *
      strength *
      3.6;
  }

  return output;
}


/* ============================================================
   COLORS
   ============================================================ */
function buildColors(
  count
){

  const colors =
    new Float32Array(
      count * 3
    );

  for(
    let i=0;
    i<count;
    i++
  ){

    const hex =
      CONFIG.colors[
        Math.floor(
          Math.random() *
          CONFIG.colors.length
        )
      ];

    const c =
      new THREE.Color(
        hex
      );

    colors[i*3] =
      c.r;

    colors[i*3+1] =
      c.g;

    colors[i*3+2] =
      c.b;
  }

  return colors;
}


/* ============================================================
   BUFFER REBUILD
   ============================================================ */
function rebuildParticles({
  svg=currentSvg,
  count=particleCount,
  motion=CONFIG.motion,
  scatter=true
} = {}){

  currentSvg =
    svg;

  particleCount =
    count;

  targetPositions =
    buildTargetPositions(
      svg,
      count
    );

  startPositions =
    scatter
      ? buildScatterPositions(
          count,
          motion
        )
      : targetPositions.slice();

  currentPositions =
    startPositions.slice();

  curveOffsets =
    buildCurveOffsets(
      count,
      motion
    );

  geometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
      currentPositions,
      3
    )
  );

  geometry.setAttribute(
    "color",
    new THREE.BufferAttribute(
      buildColors(count),
      3
    )
  );

  geometry.attributes.position.needsUpdate =
    true;
}


/* ============================================================
   MOTION INTERPOLATION
   Anime.js animates one scalar; Three.js renders the particles.
   ============================================================ */
function updateParticlePositions(
  t,
  motion
){

  const pos =
    geometry.attributes.position.array;

  const arc =
    Math.sin(
      Math.PI*t
    );

  for(
    let i=0;
    i<particleCount;
    i++
  ){

    const base =
      i*3;

    let extra =
      arc;

    if(
      motion === "impact"
    ){
      extra =
        Math.sin(
          Math.PI*t
        ) *
        .52;
    }

    pos[base] =
      startPositions[base] *
      (1-t) +
      targetPositions[base] *
      t +
      curveOffsets[base] *
      extra;

    pos[base+1] =
      startPositions[base+1] *
      (1-t) +
      targetPositions[base+1] *
      t +
      curveOffsets[base+1] *
      extra;

    pos[base+2] =
      startPositions[base+2] *
      (1-t) +
      targetPositions[base+2] *
      t +
      curveOffsets[base+2] *
      extra;
  }

  geometry.attributes.position.needsUpdate =
    true;
}


/* ============================================================
   PUBLIC ASSEMBLE / SCATTER API
   ============================================================ */
function assemble({
  motion=CONFIG.motion,
  duration
} = {}){

  if(activeAnimation){
    activeAnimation.pause();
  }

  /*
    Always start from the actual current particle positions.
  */
  startPositions =
    geometry.attributes.position.array.slice();

  curveOffsets =
    buildCurveOffsets(
      particleCount,
      motion
    );

  animationProxy.t =
    0;

  const selectedDuration =
    duration ||
    (
      motion === "impact"
        ? 720
        : motion === "soft"
        ? 1500
        : 1180
    );

  activeAnimation =
    anime({
      targets:animationProxy,
      t:1,
      duration:selectedDuration,
      easing:
        motion === "impact"
          ? "easeOutExpo"
          : "easeInOutCubic",

      update:() => {
        updateParticlePositions(
          animationProxy.t,
          motion
        );
      }
    });

  return activeAnimation;
}


function scatter({
  motion=CONFIG.motion
} = {}){

  if(activeAnimation){
    activeAnimation.pause();
  }

  startPositions =
    geometry.attributes.position.array.slice();

  targetPositions =
    buildScatterPositions(
      particleCount,
      motion
    );

  curveOffsets =
    buildCurveOffsets(
      particleCount,
      motion
    );

  animationProxy.t =
    0;

  activeAnimation =
    anime({
      targets:animationProxy,
      t:1,
      duration:900,
      easing:"easeInOutCubic",

      update:() => {
        updateParticlePositions(
          animationProxy.t,
          motion
        );
      },

      complete:() => {
        /*
          After scatter completes, rebuild the real logo target.
        */
        startPositions =
          geometry.attributes.position.array.slice();

        targetPositions =
          buildTargetPositions(
            currentSvg,
            particleCount
          );
      }
    });

  return activeAnimation;
}


/* ============================================================
   SHAPE SWITCH = MORPH
   ============================================================ */
function setShape(
  svg,
  motion=CONFIG.motion
){

  if(activeAnimation){
    activeAnimation.pause();
  }

  currentSvg =
    svg;

  startPositions =
    geometry.attributes.position.array.slice();

  targetPositions =
    buildTargetPositions(
      svg,
      particleCount
    );

  curveOffsets =
    buildCurveOffsets(
      particleCount,
      motion
    );

  animationProxy.t =
    0;

  activeAnimation =
    anime({
      targets:animationProxy,
      t:1,
      duration:1200,
      easing:"easeInOutCubic",

      update:() => {
        updateParticlePositions(
          animationProxy.t,
          motion
        );
      }
    });

  return activeAnimation;
}


/* ============================================================
   RENDER LOOP
   ============================================================ */
function render(){

  requestAnimationFrame(
    render
  );

  points.rotation.y =
    Math.sin(
      performance.now() *
      .00016
    ) *
    .035;

  renderer.render(
    scene,
    camera
  );
}


/* ============================================================
   INITIAL
   ============================================================ */
rebuildParticles({
  svg:currentSvg,
  count:particleCount,
  motion:CONFIG.motion,
  scatter:true
});

render();

setTimeout(
  () => {
    assemble({
      motion:CONFIG.motion
    });
  },
  240
);


/* ============================================================
   CONTROLS
   ============================================================ */
const status =
  document.querySelector(
    "#status"
  );


document
  .querySelectorAll("[data-shape]")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll("[data-shape]")
          .forEach(el => {
            el.classList.remove(
              "active"
            );
          });

        button.classList.add(
          "active"
        );

        const name =
          button.dataset.shape;

        setShape(
          SHAPES[name],
          document.querySelector(
            "#motionSelect"
          ).value
        );

        status.textContent =
          `Morph → ${name}`;
      }
    );

  });


document
  .querySelector("#densitySelect")
  .addEventListener(
    "change",
    event => {

      particleCount =
        Number(
          event.target.value
        );

      rebuildParticles({
        svg:currentSvg,
        count:particleCount,
        motion:
          document.querySelector(
            "#motionSelect"
          ).value,
        scatter:true
      });

      assemble({
        motion:
          document.querySelector(
            "#motionSelect"
          ).value
      });

      status.textContent =
        `Particle count · ${particleCount}`;
    }
  );


document
  .querySelector("#motionSelect")
  .addEventListener(
    "change",
    event => {

      CONFIG.motion =
        event.target.value;

      scatter({
        motion:CONFIG.motion
      });

      setTimeout(
        () => {
          assemble({
            motion:CONFIG.motion
          });
        },
        940
      );

      status.textContent =
        `Motion · ${CONFIG.motion}`;
    }
  );


document
  .querySelector("#scatterBtn")
  .addEventListener(
    "click",
    () => {

      scatter({
        motion:
          document.querySelector(
            "#motionSelect"
          ).value
      });

      status.textContent =
        "Scattering particles";
    }
  );


document
  .querySelector("#assembleBtn")
  .addEventListener(
    "click",
    () => {

      targetPositions =
        buildTargetPositions(
          currentSvg,
          particleCount
        );

      assemble({
        motion:
          document.querySelector(
            "#motionSelect"
          ).value
      });

      status.textContent =
        "Assembling logo";
    }
  );


/* ============================================================
   SVG UPLOAD
   ============================================================ */
document
  .querySelector("#svgUpload")
  .addEventListener(
    "change",
    event => {

      const file =
        event.target.files &&
        event.target.files[0];

      if(!file){
        return;
      }

      const reader =
        new FileReader();

      reader.onload =
        e => {

          const svg =
            String(
              e.target.result || ""
            );

          if(
            !svg.includes("<svg")
          ){
            status.textContent =
              "Invalid SVG";

            return;
          }

          try{

            /*
              Validate before morphing.
            */
            parseSubPaths(
              svg
            );

            document
              .querySelectorAll("[data-shape]")
              .forEach(el => {
                el.classList.remove(
                  "active"
                );
              });

            setShape(
              svg,
              document.querySelector(
                "#motionSelect"
              ).value
            );

            status.textContent =
              `Custom SVG · ${file.name}`;

          }catch(error){

            status.textContent =
              "SVG path parsing failed";

            console.error(
              error
            );
          }
        };

      reader.readAsText(
        file
      );
    }
  );


/* ============================================================
   RESIZE
   ============================================================ */
window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );
  }
);


/* ============================================================
   GLOBAL API
   ============================================================ */
window.particleAssemble = {
  assemble,
  scatter,
  setShape
};
</script>
</body>
</html>
