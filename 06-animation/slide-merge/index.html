<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Logo Reveal — Slide Merge</title>

<style>
  :root{
    --bg:#070a0f;
    --text:#f6f8fb;
    --muted:rgba(235,241,247,.54);
    --accent:#ff7a16;
    --line:rgba(255,255,255,.09);
  }

  *{box-sizing:border-box}

  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 48%,rgba(255,122,22,.045),transparent 24%),
      linear-gradient(180deg,#090d12,#06080c 72%);
    color:var(--text);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }

  .stage{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    isolation:isolate;
  }

  .stage::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 50%,transparent 0 44%,rgba(0,0,0,.12) 68%,rgba(0,0,0,.42) 100%);
  }

  .topbar{
    position:absolute;
    left:30px;
    right:30px;
    top:28px;
    z-index:20;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    pointer-events:none;
  }

  .eyebrow{
    margin-bottom:7px;
    color:var(--accent);
    font-size:10px;
    font-weight:800;
    letter-spacing:.18em;
    text-transform:uppercase;
  }

  h1{
    margin:0;
    font-size:20px;
    font-weight:690;
    letter-spacing:-.025em;
  }

  .meta{
    text-align:right;
    color:rgba(255,255,255,.42);
    font-size:10px;
    line-height:1.55;
  }

  .reveal-zone{
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    padding:80px 40px 120px;
  }

  .logo-lockup{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:clamp(18px,2.3vw,34px);
    min-width:min(780px,82vw);
    min-height:220px;
  }

  .asset{
    position:relative;
    display:grid;
    place-items:center;
    will-change:transform,opacity,filter;
  }

  .icon-asset{
    width:clamp(120px,15vw,210px);
    aspect-ratio:1;
  }

  .wordmark-asset{
    min-width:clamp(280px,36vw,520px);
    height:clamp(100px,13vw,180px);
  }

  .asset img{
    display:none;
    width:100%;
    height:100%;
    object-fit:contain;
  }

  .placeholder-icon,
  .placeholder-word{
    display:block;
    width:100%;
    height:100%;
  }

  .placeholder-icon{
    filter:drop-shadow(0 8px 30px rgba(255,122,22,.16));
  }

  .placeholder-word{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    color:#fff;
    font-size:clamp(46px,7vw,96px);
    font-weight:780;
    letter-spacing:-.065em;
    white-space:nowrap;
  }

  .placeholder-word span{
    color:var(--accent);
  }

  .ghost-layer{
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    pointer-events:none;
    opacity:0;
    will-change:transform,opacity,filter;
  }

  .ghost-layer > *{
    width:100%;
    height:100%;
  }

  .merge-flash{
    position:absolute;
    left:50%;
    top:50%;
    width:160px;
    height:160px;
    transform:translate(-50%,-50%) scale(.4);
    border-radius:50%;
    background:radial-gradient(circle,rgba(255,235,205,.55),rgba(255,122,22,.18) 34%,transparent 72%);
    filter:blur(10px);
    opacity:0;
    pointer-events:none;
  }

  .merge-line{
    position:absolute;
    left:50%;
    top:50%;
    width:min(52vw,680px);
    height:1px;
    transform:translate(-50%,-50%) scaleX(0);
    transform-origin:center;
    background:linear-gradient(90deg,transparent,rgba(255,122,22,.45),rgba(255,255,255,.72),rgba(255,122,22,.45),transparent);
    box-shadow:0 0 18px rgba(255,122,22,.28);
    opacity:0;
    pointer-events:none;
  }

  .caption{
    position:absolute;
    left:50%;
    top:calc(50% + 140px);
    transform:translateX(-50%);
    color:rgba(255,255,255,.30);
    font-size:9px;
    letter-spacing:.14em;
    text-transform:uppercase;
    pointer-events:none;
  }

  .controls{
    position:absolute;
    left:50%;
    bottom:28px;
    z-index:30;
    transform:translateX(-50%);
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
  }

  button,
  select,
  .upload-label{
    appearance:none;
    border:1px solid rgba(255,255,255,.12);
    border-radius:999px;
    background:rgba(0,0,0,.26);
    color:rgba(255,255,255,.76);
    padding:9px 12px;
    font:inherit;
    font-size:10px;
    letter-spacing:.045em;
    cursor:pointer;
    backdrop-filter:blur(12px);
  }

  button:hover,
  select:hover,
  .upload-label:hover{
    color:#fff;
    background:rgba(255,255,255,.07);
    border-color:rgba(255,255,255,.24);
  }

  .primary{
    color:#fff;
    border-color:rgba(255,122,22,.34);
    background:rgba(255,122,22,.10);
  }

  input[type=file]{
    display:none;
  }

  .status{
    position:absolute;
    left:30px;
    bottom:30px;
    z-index:20;
    color:rgba(255,255,255,.25);
    font-size:9px;
    letter-spacing:.08em;
    text-transform:uppercase;
  }

  @media(max-width:780px){
    .topbar{left:20px;right:20px;top:20px}
    .meta{display:none}
    .logo-lockup{
      min-width:0;
      width:92vw;
      gap:14px;
    }
    .icon-asset{width:28vw}
    .wordmark-asset{min-width:54vw;height:28vw}
    .placeholder-word{font-size:clamp(34px,10vw,64px)}
    .controls{bottom:18px;width:92vw}
    .status{display:none}
  }
</style>
</head>

<body>
<main class="stage">

  <div class="topbar">
    <div>
      <div class="eyebrow">Logo Reveal / Slide Merge</div>
      <h1>Slide Merge</h1>
    </div>

    <div class="meta">
      Anime.js + CSS transforms<br>
      Ghost trails + overshoot + settle
    </div>
  </div>

  <section class="reveal-zone">

    <div class="logo-lockup" id="logoLockup">

      <div class="asset icon-asset" id="iconAsset">

        <div class="placeholder-icon">
          <svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="g" x1="0" x2="1">
                <stop offset="0" stop-color="#ff7a16"/>
                <stop offset=".55" stop-color="#ffb45f"/>
                <stop offset="1" stop-color="#ffffff"/>
              </linearGradient>
            </defs>
            <path d="M110 18 L137 78 L202 88 L154 132 L165 197 L110 166 L55 197 L66 132 L18 88 L83 78 Z"
                  fill="none" stroke="url(#g)" stroke-width="12" stroke-linejoin="round"/>
          </svg>
        </div>

        <img id="iconImage" alt="Icon">
      </div>


      <div class="asset wordmark-asset" id="wordAsset">

        <div class="placeholder-word">
          NOVA<span>FORM</span>
        </div>

        <img id="wordImage" alt="Wordmark">
      </div>

      <div class="merge-flash" id="mergeFlash"></div>
      <div class="merge-line" id="mergeLine"></div>
    </div>

    <div class="caption">
      icon → ← wordmark · impact · overshoot · settle
    </div>
  </section>


  <div class="controls">

    <select id="speedSelect">
      <option value="0.78">Fast</option>
      <option value="1" selected>Standard</option>
      <option value="1.25">Cinematic</option>
    </select>

    <select id="trailSelect">
      <option value="3">Trail ×3</option>
      <option value="5" selected>Trail ×5</option>
      <option value="7">Trail ×7</option>
    </select>

    <label class="upload-label">
      Upload Icon
      <input id="iconUpload" type="file" accept="image/png,image/webp,image/jpeg,image/svg+xml">
    </label>

    <label class="upload-label">
      Upload Wordmark
      <input id="wordUpload" type="file" accept="image/png,image/webp,image/jpeg,image/svg+xml">
    </label>

    <button class="primary" id="replayBtn">Replay</button>
  </div>

  <div class="status" id="status">Ready</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>

<script>
/* ============================================================
   REUSE CONFIG
   ============================================================ */
const CONFIG = {
  icon: "#iconAsset",
  wordmark: "#wordAsset",

  iconFromX: -620,
  wordFromX: 620,

  overshoot: 24,

  impactDuration: 460,
  settleDuration: 420,

  trailCount: 5,
  speed: 1,

  easingImpact: "easeOutExpo",
  easingSettle: "easeOutElastic(1, .52)"
};


/* ============================================================
   TRAIL CREATION
   Clone the actual rendered asset so uploaded PNG/SVG works too.
   ============================================================ */
function buildGhosts(asset, count){

  asset
    .querySelectorAll(".ghost-layer")
    .forEach(el => el.remove());

  const ghosts = [];

  for(let i=0;i<count;i++){

    const ghost =
      document.createElement("div");

    ghost.className =
      "ghost-layer";

    const contentNodes =
      [...asset.children]
        .filter(el =>
          !el.classList.contains("ghost-layer")
        );

    contentNodes.forEach(node => {

      if(
        node.id === "mergeFlash" ||
        node.id === "mergeLine"
      ){
        return;
      }

      const clone =
        node.cloneNode(true);

      if(clone.id){
        clone.removeAttribute("id");
      }

      ghost.appendChild(
        clone
      );
    });

    asset.appendChild(
      ghost
    );

    ghosts.push(
      ghost
    );
  }

  return ghosts;
}


/* ============================================================
   RESET
   ============================================================ */
function resetReveal({
  icon,
  wordmark,
  iconGhosts,
  wordGhosts
}){

  anime.remove(
    [
      icon,
      wordmark,
      ...iconGhosts,
      ...wordGhosts,
      "#mergeFlash",
      "#mergeLine"
    ]
  );

  anime.set(icon,{
    translateX:CONFIG.iconFromX,
    opacity:0,
    filter:"blur(10px)"
  });

  anime.set(wordmark,{
    translateX:CONFIG.wordFromX,
    opacity:0,
    filter:"blur(10px)"
  });

  anime.set(
    [...iconGhosts,...wordGhosts],
    {
      opacity:0
    }
  );

  anime.set("#mergeFlash",{
    opacity:0,
    scale:.4
  });

  anime.set("#mergeLine",{
    opacity:0,
    scaleX:0
  });
}


/* ============================================================
   GHOST TRAIL TIMING
   ============================================================ */
function animateTrail({
  ghosts,
  fromX,
  overshootX,
  duration,
  delayStep
}){

  ghosts.forEach(
    (ghost,index) => {

      const ratio =
        1 -
        index /
        Math.max(
          ghosts.length,
          1
        );

      anime.set(
        ghost,
        {
          translateX:fromX,
          opacity:0,
          filter:
            `blur(${7 + index*2}px)`
        }
      );

      anime({
        targets:ghost,

        translateX:
          overshootX,

        opacity:[
          {
            value:
              .22 * ratio,
            duration:90
          },
          {
            value:0,
            duration:
              duration*.72
          }
        ],

        duration:
          duration +
          index*26,

        delay:
          index *
          delayStep,

        easing:
          "easeOutExpo"
      });
    }
  );
}


/* ============================================================
   PUBLIC API
   ============================================================ */
function createSlideMergeReveal({
  icon = CONFIG.icon,
  wordmark = CONFIG.wordmark,
  trailCount = CONFIG.trailCount,
  speed = CONFIG.speed
} = {}){

  const iconEl =
    typeof icon === "string"
      ? document.querySelector(icon)
      : icon;

  const wordEl =
    typeof wordmark === "string"
      ? document.querySelector(wordmark)
      : wordmark;

  const iconGhosts =
    buildGhosts(
      iconEl,
      trailCount
    );

  const wordGhosts =
    buildGhosts(
      wordEl,
      trailCount
    );

  resetReveal({
    icon:iconEl,
    wordmark:wordEl,
    iconGhosts,
    wordGhosts
  });

  const impactDuration =
    CONFIG.impactDuration *
    speed;

  const settleDuration =
    CONFIG.settleDuration *
    speed;

  animateTrail({
    ghosts:iconGhosts,
    fromX:CONFIG.iconFromX,
    overshootX:CONFIG.overshoot,
    duration:impactDuration,
    delayStep:18*speed
  });

  animateTrail({
    ghosts:wordGhosts,
    fromX:CONFIG.wordFromX,
    overshootX:-CONFIG.overshoot,
    duration:impactDuration,
    delayStep:18*speed
  });


  const timeline =
    anime.timeline({
      autoplay:true
    });


  timeline

    /*
      PHASE 1
      Fast inward movement.
    */
    .add({
      targets:iconEl,

      translateX:
        CONFIG.overshoot,

      opacity:[
        {value:1,duration:80}
      ],

      filter:[
        {
          value:"blur(0px)",
          duration:
            impactDuration*.70
        }
      ],

      duration:
        impactDuration,

      easing:
        CONFIG.easingImpact
    },0)

    .add({
      targets:wordEl,

      translateX:
        -CONFIG.overshoot,

      opacity:[
        {value:1,duration:80}
      ],

      filter:[
        {
          value:"blur(0px)",
          duration:
            impactDuration*.70
        }
      ],

      duration:
        impactDuration,

      easing:
        CONFIG.easingImpact
    },0)


    /*
      PHASE 2
      Small flash at the crossover / impact point.
    */
    .add({
      targets:"#mergeFlash",

      opacity:[
        {value:.92,duration:80},
        {value:0,duration:220}
      ],

      scale:[
        {value:1.25,duration:140},
        {value:1.8,duration:160}
      ],

      easing:
        "easeOutQuad"
    },
    impactDuration*.73)


    .add({
      targets:"#mergeLine",

      opacity:[
        {value:.65,duration:90},
        {value:0,duration:260}
      ],

      scaleX:[
        {value:1,duration:150},
        {value:1.12,duration:200}
      ],

      easing:
        "easeOutExpo"
    },
    impactDuration*.73)


    /*
      PHASE 3
      Elastic settle to exact lockup.
    */
    .add({
      targets:[
        iconEl,
        wordEl
      ],

      translateX:0,

      duration:
        settleDuration,

      easing:
        CONFIG.easingSettle
    },
    impactDuration*.82);


  return {
    timeline,
    icon:iconEl,
    wordmark:wordEl,
    iconGhosts,
    wordGhosts
  };
}


/* ============================================================
   DEMO CONTROLS
   ============================================================ */
const status =
  document.querySelector("#status");

function runDemo(){

  const speed =
    Number(
      document.querySelector(
        "#speedSelect"
      ).value
    );

  const trailCount =
    Number(
      document.querySelector(
        "#trailSelect"
      ).value
    );

  createSlideMergeReveal({
    speed,
    trailCount
  });

  status.textContent =
    `Replay · speed ${speed}× · trail ${trailCount}`;
}


document
  .querySelector("#replayBtn")
  .addEventListener(
    "click",
    runDemo
  );

document
  .querySelector("#speedSelect")
  .addEventListener(
    "change",
    runDemo
  );

document
  .querySelector("#trailSelect")
  .addEventListener(
    "change",
    runDemo
  );


/* ============================================================
   ASSET UPLOAD
   ============================================================ */
function bindUpload({
  inputId,
  imageId,
  placeholderSelector
}){

  const input =
    document.querySelector(inputId);

  const image =
    document.querySelector(imageId);

  const placeholder =
    document.querySelector(
      placeholderSelector
    );

  input.addEventListener(
    "change",
    event => {

      const file =
        event.target.files &&
        event.target.files[0];

      if(!file){
        return;
      }

      const reader =
        new FileReader();

      reader.onload =
        e => {

          image.onload =
            () => {

              placeholder.style.display =
                "none";

              image.style.display =
                "block";

              runDemo();
            };

          image.src =
            e.target.result;
        };

      reader.readAsDataURL(
        file
      );
    }
  );
}


bindUpload({
  inputId:"#iconUpload",
  imageId:"#iconImage",
  placeholderSelector:"#iconAsset .placeholder-icon"
});

bindUpload({
  inputId:"#wordUpload",
  imageId:"#wordImage",
  placeholderSelector:"#wordAsset .placeholder-word"
});


/* ============================================================
   INITIAL PLAY
   ============================================================ */
window.addEventListener(
  "load",
  () => {

    setTimeout(
      runDemo,
      120
    );
  }
);


/* ============================================================
   GLOBAL API
   ============================================================ */
window.logoReveal = {
  play:createSlideMergeReveal
};
</script>
</body>
</html>
